name: CI

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, dev]

# Least-privilege default (L10 audit finding): this workflow only reads the repo (checkout) and
# runs tests — it never needs to write anything. Overridden per-job below only where a job
# genuinely needs more (none currently do).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      # persist-credentials: false — otherwise checkout injects the workflow
      # GITHUB_TOKEN as an http.https://github.com/.extraheader that overrides
      # the FORGESWORN_READ_PAT insteadOf rewrite below, and npm ci 404s on the
      # private @forgesworn/tessera-kit dependency (GITHUB_TOKEN can't see other repos).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # @forgesworn/tessera-kit is a private git+https dependency. npm normalises
      # git+https github.com URLs to ssh://git@github.com/, so all three URL forms
      # must be rewritten to inject a read-only PAT over HTTPS — rewriting only the
      # https:// form leaves npm's normalised ssh:// form unauthenticated.
      # Requires repo secret FORGESWORN_READ_PAT (fine-grained, read on
      # forgesworn/tessera-kit).
      - name: Authenticate git for private @forgesworn deps
        # PAT via env, not inline ${{ }} interpolation, so the secret never lands
        # in the rendered command line / shell trace.
        env:
          FORGESWORN_READ_PAT: ${{ secrets.FORGESWORN_READ_PAT }}
        run: |
          AUTH="https://x-access-token:${FORGESWORN_READ_PAT}@github.com/"
          git config --global url."$AUTH".insteadOf "https://github.com/"
          git config --global --add url."$AUTH".insteadOf "ssh://git@github.com/"
          git config --global --add url."$AUTH".insteadOf "git@github.com:"
      - run: npm ci
      # Scope the PAT to the install step (L10 audit finding): the git-credential rewrite above
      # stays live in the global git config through every later step (build, vectors:check, test)
      # otherwise, for no reason — nothing after `npm ci` touches git. Remove it as soon as the
      # install that needed it is done; `if: always()` so it still runs (and the PAT is scrubbed)
      # even if `npm ci` itself failed.
      - name: Revoke git PAT auth (install step only)
        if: always()
        env:
          FORGESWORN_READ_PAT: ${{ secrets.FORGESWORN_READ_PAT }}
        run: |
          AUTH="https://x-access-token:${FORGESWORN_READ_PAT}@github.com/"
          git config --global --unset-all url."$AUTH".insteadOf || true
      - run: npm run typecheck
      - run: npm run build
      - run: npm run vectors:check
      - run: npm test
      # Publish guard (H1): refuse git/file/link/http(s) specs in dependencies/optionalDependencies/
      # peerDependencies. It also runs in `prepack`, which is what the release pipeline's `npm pack`
      # triggers; running it here surfaces a violation on every push, not only at release time.
      # Last on purpose: while @forgesworn/tessera-kit is still a git dependency this step fails,
      # and the steps above still report their own results.
      - run: npm run check:publishable-deps
