name: CI

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # @forgesworn/tessera-kit is a private git+https dependency. Rewrite
      # github.com HTTPS clones to inject a read-only PAT so `npm ci` can
      # resolve it. Requires repo secret FORGESWORN_READ_PAT (fine-grained
      # PAT with read access to forgesworn/tessera-kit).
      - name: Authenticate git for private @forgesworn deps
        run: git config --global url."https://x-access-token:${{ secrets.FORGESWORN_READ_PAT }}@github.com/".insteadOf "https://github.com/"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run vectors:check
      - run: npm test
