name: CI

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, dev]

# Least-privilege default (L10 audit finding): this workflow only reads the repo (checkout) and
# runs tests — it never needs to write anything. Overridden per-job below only where a job
# genuinely needs more (none currently do).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      # persist-credentials: false — nothing after checkout needs the workflow token, so don't
      # leave it in the git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Every dependency comes from the npm registry, so the install needs no git credentials.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run vectors:check
      - run: npm test
      - run: npm run lint:package
      # Runs the real `prepack` guard (scripts/check-publishable-deps.mjs), so CI also fails if a
      # dependency ever becomes a git/file/http(s) spec again.
      - run: npm pack --dry-run
